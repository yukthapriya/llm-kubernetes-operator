apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-operator-controller-sa
  namespace: myukthapriya-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-operator-role
  namespace: myukthapriya-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ai.redhat.example.com"]
    resources: ["llmdeployments", "llmdeployments/status", "llmdeployments/finalizers"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-operator-rolebinding
  namespace: myukthapriya-dev
subjects:
  - kind: ServiceAccount
    name: llm-operator-controller-sa
    namespace: myukthapriya-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-operator-role
